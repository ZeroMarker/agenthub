<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    AgentHub app icon — design source of truth.
    Regenerate raster assets with sharp (2x supersample then downscale):
      sharp('icon-master.svg', { density: 192 }).resize(2048, 2048) → 32/128/256/512 PNG,
      ICO (16-256) and ICNS (ic04-ic10) from the 512/1024 renders.
    Palette: M3 purple #6750A4 family → #7C3AED/#5B21B6/#3B0764, accent #47BFFF/#67E8F9.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.82" cy="0.84" r="0.55">
      <stop offset="0" stop-color="#47BFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#47BFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topGlow" cx="0.22" cy="0.16" r="0.5">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0.32" y1="0" x2="0.68" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DDFB"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E0A4A" flood-opacity="0.42"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="836" cy="832" r="440" fill="url(#cyanGlow)" filter="url(#soft)"/>
  <circle cx="240" cy="170" r="400" fill="url(#topGlow)" filter="url(#soft)"/>

  <!-- lightning bolt (rounded) -->
  <g filter="url(#shadow)">
    <path d="M 590.9 147.8 Q 594.0 128.0 583.7 145.1 L 367.7 503.6 Q 344.0 543.0 390.0 543.0 L 460.0 543.0 Q 486.0 543.0 482.1 568.7 L 435.0 876.2 Q 432.0 896.0 442.1 878.7 L 656.9 509.8 Q 680.0 470.0 634.0 470.0 L 566.0 470.0 Q 540.0 470.0 544.1 444.3 L 590.9 147.8 Z" fill="url(#bolt)"/>
  </g>

  <!-- hub orbit: satellite node + ring -->
  <circle cx="716" cy="744" r="92" fill="none" stroke="#67E8F9" stroke-width="13" opacity="0.9"/>
  <circle cx="716" cy="744" r="92" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
  <circle cx="716" cy="652" r="25" fill="#67E8F9"/>
  <circle cx="716" cy="652" r="25" fill="none" stroke="#FFFFFF" stroke-width="7" opacity="0.85"/>
  <circle cx="806" cy="822" r="14" fill="#FFFFFF" opacity="0.75"/>
</svg>
