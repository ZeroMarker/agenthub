name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './agenthub-ui/src-tauri -> target'

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: agenthub-ui

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: agenthub-ui
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentHub ${{ github.ref_name }}'
          releaseBody: |
            ## AgentHub ${{ github.ref_name }}
            
            See [CHANGELOG](CHANGELOG.md) for details.

            SHA-256 checksums are attached for every artifact. Signing status per platform: see [docs/signing-policy.md](docs/signing-policy.md). Unsigned artifacts are explicitly declared there.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          # Release artifacts live under target/<triple>/release/bundle/...
          # plus the raw binary in the release dir itself. Use find so we
          # cover all bundle subdirectories (appimage/deb/rpm/nsis/macos).
          cd "agenthub-ui/src-tauri/target/${{ matrix.target }}/release"
          find . -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.tar.gz' \
            -o -name 'agenthub*' \) -print0 | sort -z | xargs -0 -r sha256sum \
            > "${GITHUB_WORKSPACE}/SHA256SUMS-${{ matrix.target }}"
          wc -l "${GITHUB_WORKSPACE}/SHA256SUMS-${{ matrix.target }}"

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.target }}
          path: SHA256SUMS-*

      - name: Attach checksums to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if compgen -G 'SHA256SUMS-*' > /dev/null; then
            gh release upload "${{ github.ref_name }}" SHA256SUMS-* --clobber
          fi