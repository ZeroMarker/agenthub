name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.4.0 → tag v1.4.0). Leave empty when triggered by a pushed tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Resolve the release tag and ensure the draft release exists BEFORE the build matrix.
  # tauri-action historically hit "Resource not accessible by integration" (403) when it
  # created the release itself on tag-push runs; pre-creating the draft via `gh` (proven
  # working) and handing tauri-action a releaseId keeps it on the upload-only path.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release_id: ${{ steps.ensure.outputs.release_id }}
    steps:
      - name: Resolve release tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ inputs.version }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "v" ]; then
            echo "::error::Could not resolve release tag — push a v* tag or provide the workflow_dispatch 'version' input"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Ensure draft release exists
        id: ensure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          gh release create "$TAG" -R "${{ github.repository }}" \
            --draft \
            --title "AgentHub $TAG" \
            --notes "## AgentHub $TAG

            See [CHANGELOG](CHANGELOG.md) for details.

            SHA-256 checksums are attached for every artifact. Signing status per platform: see [docs/signing-policy.md](docs/signing-policy.md). Unsigned artifacts are explicitly declared there." \
            || echo "::warning::Draft release for $TAG already exists, reusing it"
          RELEASE_ID="$(gh release view "$TAG" -R "${{ github.repository }}" --json databaseId -q .databaseId)"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Draft release #$RELEASE_ID ready for $TAG"

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './agenthub-ui/src-tauri -> target'

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: agenthub-ui

      - name: Build Tauri app and upload to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: agenthub-ui
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          # Cargo is a workspace at the repo root, so bundles land in
          # target/<triple>/release/bundle/{appimage,deb,rpm,nsis,macos}.
          # Hash exactly the files tauri-action uploads to the release.
          cd "target/${{ matrix.target }}/release"

          # macOS: tauri-action uploads the app tarball under a versioned name
          # (AgentHub.app.tar.gz -> AgentHub_<version>_<arch>.app.tar.gz).
          # Rename the local file so checksums match the uploaded asset name.
          ARCH=""
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH="aarch64" ;;
            x86_64-apple-darwin)  ARCH="x64" ;;
          esac
          if [ -n "$ARCH" ]; then
            VERSION=$(grep -m1 '^version' ../../../Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            for f in $(find . -type f -name 'AgentHub.app.tar.gz'); do
              mv "$f" "$(dirname "$f")/AgentHub_${VERSION}_${ARCH}.app.tar.gz"
            done
          fi

          find . -type f -name 'AgentHub*' \( -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.app.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum \
            | sed 's|\./bundle/[^/]*/||' \
            > "${GITHUB_WORKSPACE}/SHA256SUMS-${{ matrix.target }}"
          cat "${GITHUB_WORKSPACE}/SHA256SUMS-${{ matrix.target }}"

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.target }}
          path: SHA256SUMS-*

      - name: Attach checksums to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if compgen -G 'SHA256SUMS-*' > /dev/null; then
            gh release upload "${{ needs.prepare.outputs.tag }}" SHA256SUMS-* --clobber
          fi
