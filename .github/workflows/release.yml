name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './agenthub-ui/src-tauri -> target'

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: agenthub-ui

      - name: Check GITHUB_TOKEN release permission
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== GET releases (read) =="
          curl -s -o /dev/null -w 'GET /releases -> %{http_code}\n' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases
          echo "== POST releases (write) =="
          BODY=$(mktemp)
          echo '{"tag_name":"__perm_probe__","name":"perm probe","draft":true}' > "$BODY"
          CODE=$(curl -s -o /tmp/probe.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data @"$BODY" \
            https://api.github.com/repos/${{ github.repository }}/releases)
          echo "POST /releases -> $CODE"
          if [ "$CODE" = "201" ]; then
            ID=$(python3 -c "import json;print(json.load(open('/tmp/probe.json'))['id'])")
            echo "== DELETE probe release $ID =="
            curl -s -o /dev/null -w 'DELETE -> %{http_code}\n' -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/releases/$ID
          else
            cat /tmp/probe.json
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: agenthub-ui
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentHub ${{ github.ref_name }}'
          releaseBody: |
            ## AgentHub ${{ github.ref_name }}
            
            See [CHANGELOG](CHANGELOG.md) for details.

            SHA-256 checksums are attached for every artifact. Signing status per platform: see [docs/signing-policy.md](docs/signing-policy.md). Unsigned artifacts are explicitly declared there.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          # Cargo is a workspace at the repo root, so bundles land in
          # target/<triple>/release/bundle/{appimage,deb,rpm,nsis,macos}.
          # Hash exactly the files tauri-action uploads to the release.
          cd "target/${{ matrix.target }}/release"
          find . -type f -name 'AgentHub*' \( -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.app.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum \
            | sed 's|\./bundle/[^/]*/||' \
            > "${GITHUB_WORKSPACE}/SHA256SUMS-${{ matrix.target }}"
          cat "${GITHUB_WORKSPACE}/SHA256SUMS-${{ matrix.target }}"

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.target }}
          path: SHA256SUMS-*

      - name: Attach checksums to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if compgen -G 'SHA256SUMS-*' > /dev/null; then
            gh release upload "${{ github.ref_name }}" SHA256SUMS-* --clobber
          fi