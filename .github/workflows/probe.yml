name: token-probe

on:
  push:
    tags:
      - 'probe-*'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GITHUB_TOKEN write on tag push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== GET releases =="
          curl -s -o /dev/null -w 'GET -> %{http_code}\n' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases
          echo "== POST create draft =="
          curl -s -o /tmp/probe.json -w 'POST -> %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"tag_name":"__tagprobe__","name":"tagprobe","draft":true}' \
            https://api.github.com/repos/${{ github.repository }}/releases
          cat /tmp/probe.json | head -5
          echo ""
          echo "== DELETE probe =="
          ID=$(python3 -c "import json;print(json.load(open('/tmp/probe.json')).get('id',''))" 2>/dev/null)
          if [ -n "$ID" ]; then
            curl -s -o /dev/null -w 'DELETE -> %{http_code}\n' -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/releases/$ID
          fi
